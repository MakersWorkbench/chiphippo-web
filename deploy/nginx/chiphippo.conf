server {
    listen 80;
    listen [::]:80;
    server_name breadboardlab.themakersworkbench.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name breadboardlab.themakersworkbench.com;

    ssl_certificate /etc/letsencrypt/live/breadboardlab.themakersworkbench.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/breadboardlab.themakersworkbench.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
