<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP: only load scripts/styles/fonts from the same origin. The renderer
      uses the platform bridge for I/O. Electron delegates it to main; the web
      adapter fetches only bundled same-origin assets.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src  'self';
        style-src   'self' 'unsafe-inline';
        font-src    'self';
        img-src     'self' data:;
        object-src  'none';
        base-uri    'none';
        form-action 'none';
      "
    />
    <title>Chip Hippo</title>
    <link rel="icon" type="image/svg+xml" href="/app/chiphippo-icon.svg" />

    <!-- Design tokens + reset first, then the shell layout. -->
    <link rel="stylesheet" href="/app/styles/theme.css" />
    <link rel="stylesheet" href="/app/styles/app.css" />
  </head>
  <body>
    <!-- app.js mounts the shell (header bar + desk viewport) here. -->
    <div id="app"></div>

    <script
      type="module"
      src="/app/scripts/platform/browser-bootstrap.js"
    ></script>
    <script type="module" src="/app/scripts/app.js"></script>
    <script type="module" src="/app/scripts/embed-mode.js"></script>
    <script type="module" src="/app/scripts/web-chrome.js"></script>
  </body>
</html>
